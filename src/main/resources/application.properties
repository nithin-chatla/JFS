# ==========================================================================
# CampusStay HMS - Core Application Configuration
# ==========================================================================
spring.application.name=CampusStay Hostel Management System
server.port=${PORT:9090}

# Default Active Profile: Persistent File Database (H2)
# Set to 'mysql' to connect to local/cloud MySQL database
spring.profiles.active=${SPRING_PROFILES_ACTIVE:h2}

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# File Upload Limit
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Logging Configuration
logging.level.org.springframework.web=INFO
logging.level.com.hostel.complaints=INFO
logging.level.org.hibernate.SQL=WARN
