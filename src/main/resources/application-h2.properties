# ==========================================================================
# CampusStay HMS - Persistent Local H2 Database Profile
# ==========================================================================

# File-based persistent database (stores data safely in ./data/hostel_db across restarts)
spring.datasource.url=jdbc:h2:file:./data/hostel_db;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate JPA Configuration (Dialect is auto-detected by Hibernate 6)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.generate-ddl=true
spring.jpa.show-sql=false

# H2 Web Console (accessible at http://localhost:9090/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true
